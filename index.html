<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CPEC Times</title>

    <!-- Website Icon -->
    <link rel="icon" type="image/png" href="">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manufacturing+Consent&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <div id="navbar"></div>

    <!-- Hero Image -->
    <div class="hero">

        <!-- Newspaper Title -->
        <div class="title-box">
            <h1>The CPEC Times</h1>
        </div>

    </div>

    <!-- White Content Section -->
    <div class="white-box">

        <div class="social-icons">

            <a href="https://www.instagram.com/cpec.times/" target="_blank">
                <img src="images/Instagram_icon.png" alt="Instagram" class="insta-icon">
            </a>

            <span class="social-text">Click the Icon to Follow Us on Instagram!</span>

        </div>

        <div class="dropdown">

            <button class="dropdown-button" onclick="toggleDropdown(this)">
                <span>Weekly News</span>
                <span class="arrow">▼</span>
            </button>

             <div class="dropdown-content">
                <a href="week.html?week=week1">Sep 6 - Sep 12</a>
            </div>

        </div>

        <div class="dropdown">

            <button class="dropdown-button" onclick="toggleDropdown(this)">
                <span>Articles</span>
                <span class="arrow">▼</span>
            </button>

             <div class="dropdown-content">
                <a href="articles.html">Main Page</a>
            </div>

        </div>
        
        <div class="dropdown">

            <button class="dropdown-button" onclick="toggleDropdown(this)">
                <span>Club News</span>
                <span class="arrow">▼</span>
            </button>

             <div class="dropdown-content">
                <a href="clubs.html">Main Page</a>
            </div>

        </div>


    </div>

</body>
